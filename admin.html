<script>
const BNB_TO_USDT_RATE = 600;
const ADMIN_PASSWORD_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const MAX_PROFIT_PERCENT = 5000;
const DEFAULT_MIN_BUY_AMOUNT = 0.5;
const DEFAULT_PROFIT_PERCENT = 1000;
const DEFAULT_PENDING_MESSAGE = '⏳ السحب قيد المعالجة.';
const DEFAULT_INSUFFICIENT_MESSAGE = '⚠️ الرصيد غير كافٍ لتغطية رسوم السحب';
const DEFAULT_BUY_START_HOUR = 22;
const DEFAULT_BUY_END_HOUR = 18;
const DEFAULT_SELL_START_HOUR = 20;
const DEFAULT_SELL_END_HOUR = 9;

let cachedSettings = null;
let lastSettingsFetch = 0;

async function getSettings() {
    if (cachedSettings && (Date.now() - lastSettingsFetch) < 30000) return cachedSettings;
    const defaults = { 
        exchangeRate: 10000, durationHours: 24, feePercent: 10, withdrawalFeePercent: 10,
        withdrawalFeeLabel: 'رسوم السحب', tokenName: 'عملة', withdrawCooldownHours: 24,
        sellStartHour: DEFAULT_SELL_START_HOUR, sellEndHour: DEFAULT_SELL_END_HOUR,
        buyStartHour: DEFAULT_BUY_START_HOUR, buyEndHour: DEFAULT_BUY_END_HOUR,
        profitPercent: DEFAULT_PROFIT_PERCENT, openListingTime: '7 مساءً',
        minBuyAmount: DEFAULT_MIN_BUY_AMOUNT
    };
    try {
        if (window.firebaseReady) {
            const { doc, getDocFromServer } = window.firebaseFns;
            const settingsSnap = await getDocFromServer(doc(window.db, 'settings', 'platform'));
            if (settingsSnap.exists()) {
                const data = settingsSnap.data();
                const cleaned = {};
                for (const key in data) {
                    if (data[key] !== undefined && data[key] !== null && data[key] !== 'undefined') cleaned[key] = data[key];
                }
                cachedSettings = { ...defaults, ...cleaned };
                lastSettingsFetch = Date.now();
                return cachedSettings;
            }
        }
    } catch (e) { console.error('فشل جلب الإعدادات:', e); }
    cachedSettings = defaults;
    return defaults;
}

async function saveSettings(settings) { 
    cachedSettings = null; lastSettingsFetch = 0;
    try {
        if (window.firebaseReady) {
            const { doc, setDoc } = window.firebaseFns;
            await setDoc(doc(window.db, 'settings', 'platform'), settings, { merge: true });
        }
    } catch (e) { console.error('فشل حفظ الإعدادات:', e); }
}

async function saveUserFieldToFirestore(address, fields) {
    if (!window.firebaseReady || !address) return false;
    try {
        const { doc, setDoc } = window.firebaseFns;
        const userRef = doc(window.db, 'users', address.toLowerCase());
        await setDoc(userRef, fields, { merge: true });
        return true;
    } catch (e) {
        console.error('❌ فشل الحفظ في Firestore:', e);
        showToast('❌ فشل الحفظ في السحابة', 'error');
        return false;
    }
}

async function deleteUserFromFirestore(address) {
    if (!window.firebaseReady || !address) return false;
    try {
        const { doc, deleteDoc } = window.firebaseFns;
        const userRef = doc(window.db, 'users', address.toLowerCase());
        await deleteDoc(userRef);
        return true;
    } catch (e) {
        console.error('❌ فشل الحذف من Firestore:', e);
        return false;
    }
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-100%) scale(0.9)'; setTimeout(() => toast.remove(), 500); }, 5000);
}

async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function adminLogin() {
    const password = document.getElementById('adminPasswordInput').value;
    const hash = await sha256(password);
    if (hash === ADMIN_PASSWORD_HASH) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        sessionStorage.setItem('adminLoggedIn', 'true');
        renderAdminTable();
        showToast('✅ تم تسجيل الدخول', 'success');
    } else { showToast('❌ كلمة المرور غير صحيحة', 'error'); }
}

function logout() {
    sessionStorage.removeItem('adminLoggedIn');
    location.reload();
}

window.addEventListener('load', () => {
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        renderAdminTable();
    }
    document.getElementById('adminPasswordInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') adminLogin();
    });
});

// ============ 🆕 إضافة محفظة يدوياً ============
function openAddWalletModal() {
    const modalHtml = `
        <div id="addWalletModal" class="modal-overlay" style="z-index:10000;">
            <div class="modal-content" style="max-width:560px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                    <h3 style="font-size:1.2rem;font-weight:800;color:#fff;">➕ إضافة محفظة جديدة</h3>
                    <button onclick="document.getElementById('addWalletModal').remove()" style="color:#9ca3af;font-size:1.5rem;background:none;border:none;cursor:pointer;">✕</button>
                </div>
                <p style="color:#9ca3af;font-size:0.8rem;margin-bottom:16px;line-height:1.6;">
                    💡 أضف عنوان المحفظة والبيانات. عندما يربط المستخدم هذه المحفظة، ستظهر له البيانات مباشرة.
                </p>
                <div class="settings-group">
                    <label>📍 عنوان المحفظة (Address)</label>
                    <input type="text" id="addWalletAddress" placeholder="0x..." class="input-modern" style="margin-top:8px;font-family:monospace;font-size:0.8rem;" />
                </div>
                <div class="settings-group">
                    <label>💰 رصيد العملة (Balance)</label>
                    <input type="number" id="addWalletBalance" value="0" step="0.01" min="0" class="input-modern" style="margin-top:8px;" />
                </div>
                <div class="settings-group">
                    <label>💸 رصيد السحب (USDT)</label>
                    <input type="number" id="addWalletWithdrawal" value="0" step="0.01" min="0" class="input-modern" style="margin-top:8px;" />
                </div>
                <div class="settings-group">
                    <label>📈 نسبة الأرباح الفردية (%)</label>
                    <input type="number" id="addWalletProfit" value="0" step="0.1" min="0" max="${MAX_PROFIT_PERCENT}" class="input-modern" style="margin-top:8px;" />
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
                    <button class="btn-neon" onclick="saveNewWallet()">💾 حفظ المحفظة</button>
                    <button class="btn-ghost" onclick="document.getElementById('addWalletModal').remove()">إلغاء</button>
                </div>
            </div>
        </div>`;
    const old = document.getElementById('addWalletModal');
    if (old) old.remove();
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function saveNewWallet() {
    const address = document.getElementById('addWalletAddress').value.trim();
    const balance = parseFloat(document.getElementById('addWalletBalance').value) || 0;
    const withdrawalUSDT = parseFloat(document.getElementById('addWalletWithdrawal').value) || 0;
    const profit = parseFloat(document.getElementById('addWalletProfit').value) || 0;

    if (!address || !/^0x[a-fA-F0-9]{40}$/.test(address)) {
        showToast('⚠️ عنوان المحفظة غير صحيح. يجب أن يبدأ بـ 0x ويتكون من 42 حرفاً', 'error');
        return;
    }

    if (balance < 0 || withdrawalUSDT < 0 || profit < 0) {
        showToast('⚠️ القيم يجب أن تكون موجبة', 'error');
        return;
    }

    const withdrawalBNB = withdrawalUSDT / BNB_TO_USDT_RATE;

    const payload = {
        address: address.toLowerCase(),
        balance: balance,
        withdrawalBalance: withdrawalBNB,
        customProfit: profit,
        disabled: false,
        purchaseTime: balance > 0 ? Date.now() : null,
        lastWithdrawRequestTime: 0,
        updatedAt: Date.now()
    };

    const ok = await saveUserFieldToFirestore(address, payload);
    document.getElementById('addWalletModal').remove();
    if (ok) {
        showToast(`✅ تمت إضافة المحفظة بنجاح`, 'success');
        renderAdminTable();
    } else {
        showToast('❌ فشل حفظ المحفظة', 'error');
    }
}

// ============ 🗑️ حذف محفظة ============
async function deleteUser(address) {
    const short = address.slice(0, 6) + '...' + address.slice(-4);
    if (!confirm(`⚠️ هل أنت متأكد من حذف المحفظة:\n${short}\n\nسيتم حذف جميع البيانات نهائياً!`)) return;
    if (!confirm(`🚨 تحذير أخير!\n\nهذا الإجراء لا يمكن التراجع عنه.\nهل تريد المتابعة؟`)) return;

    const ok = await deleteUserFromFirestore(address);
    if (ok) {
        showToast(`✅ تم حذف المحفظة ${short}`, 'success');
        renderAdminTable();
    } else {
        showToast('❌ فشل الحذف', 'error');
    }
}

// ============ الوظائف القديمة ============
async function updateUserStatus(address, disabled) {
    await saveUserFieldToFirestore(address, { disabled: disabled });
    renderAdminTable();
    showToast('✅ تم تحديث حالة المستخدم', 'success');
}

async function updateUserProfit(address, newProfit) {
    const profit = parseFloat(newProfit);
    if (isNaN(profit) || profit < 0 || profit > MAX_PROFIT_PERCENT) {
        showToast(`⚠️ النسبة بين 0 و ${MAX_PROFIT_PERCENT}%`, 'error'); return;
    }
    await saveUserFieldToFirestore(address, { customProfit: profit });
    renderAdminTable();
    showToast(`✅ تم تحديث نسبة الأرباح إلى ${profit}%`, 'success');
}

async function updateUserBalance(address, newBalance) {
    const balance = parseFloat(newBalance);
    if (isNaN(balance) || balance < 0) { showToast('⚠️ الرصيد يجب أن يكون رقماً موجباً', 'error'); return; }
    const payload = { balance: balance };
    if (balance > 0) payload.purchaseTime = Date.now();
    await saveUserFieldToFirestore(address, payload);
    renderAdminTable();
    showToast(`✅ تم تحديث الرصيد إلى ${balance.toFixed(2)}`, 'success');
}

async function addToUserBalance(address, amount) {
    const addAmount = parseFloat(amount);
    if (isNaN(addAmount) || addAmount === 0) { showToast('⚠️ أدخل مبلغاً صحيحاً', 'error'); return; }
    let currentBalance = 0;
    try {
        const { doc, getDocFromServer } = window.firebaseFns;
        const snap = await getDocFromServer(doc(window.db, 'users', address.toLowerCase()));
        if (snap.exists()) currentBalance = snap.data().balance || 0;
    } catch(e) {}
    const newBalance = Math.max(0, currentBalance + addAmount);
    const payload = { balance: newBalance };
    if (newBalance > 0) payload.purchaseTime = Date.now();
    await saveUserFieldToFirestore(address, payload);
    renderAdminTable();
    showToast(`✅ تم ${addAmount > 0 ? 'إضافة' : 'خصم'} ${Math.abs(addAmount).toFixed(2)}. الرصيد: ${newBalance.toFixed(2)}`, 'success');
}

async function resetUserBalance(address) {
    if (!confirm(`تصفير رصيد ${address.slice(0,6)}...${address.slice(-4)}؟`)) return;
    await saveUserFieldToFirestore(address, { balance: 0, purchaseTime: null });
    renderAdminTable();
    showToast(`✅ تم تصفير الرصيد`, 'success');
}

async function updateUserWithdrawalBalance(address, newAmountUSDT) {
    const amountUSDT = parseFloat(newAmountUSDT);
    if (isNaN(amountUSDT) || amountUSDT < 0) { showToast('⚠️ المبلغ غير صحيح', 'error'); return; }
    const amountBNB = amountUSDT / BNB_TO_USDT_RATE;
    await saveUserFieldToFirestore(address, { withdrawalBalance: amountBNB });
    renderAdminTable();
    showToast(`✅ تم تحديث رصيد السحب إلى ${amountUSDT.toFixed(2)} USDT`, 'success');
}

    const currentBalance = (cached && cached.balance) || 0;
    const currentWithdrawal = (cached && cached.withdrawalBalance) || 0;
    const modalHtml = `
        <div id="balanceEditorModal" class="modal-overlay" style="z-index:10000;">
            <div class="modal-content" style="max-width:500px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">

                    <div class="value-display" style="color:#4facfe;margin-bottom:8px;">${currentBalance.toFixed(2)}</div>
                    <input type="number" id="newBalanceInput" value="${currentBalance}" step="0.01" min="0" class="input-modern" style="margin-bottom:8px;" />
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px;">
                        <button class="btn-ghost" onclick="addToUserBalance('${address}', 100); document.getElementById('balanceEditorModal').remove();">+100</button>
                        <button class="btn-ghost" onclick="addToUserBalance('${address}', 1000); document.getElementById('balanceEditorModal').remove();">+1000</button>
                        <button class="btn-ghost" onclick="addToUserBalance('${address}', 10000); document.getElementById('balanceEditorModal').remove();">+10000</button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                        <button class="btn-neon" onclick="updateUserBalance('${address}', document.getElementById('newBalanceInput').value); document.getElementById('balanceEditorModal').remove();">💾 حفظ</button>
                        <button class="btn-danger" onclick="resetUserBalance('${address}'); document.getElementById('balanceEditorModal').remove();">🗑️ تصفير</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label>رصيد السحب الحالي (USDT)</label>
                    <div class="value-display" style="color:#f59e0b;margin-bottom:8px;">${(currentWithdrawal * BNB_TO_USDT_RATE).toFixed(2)} USDT</div>
                    <input type="number" id="newWithdrawalInput" value="${(currentWithdrawal * BNB_TO_USDT_RATE).toFixed(2)}" step="0.01" min="0" class="input-modern" style="margin-bottom:8px;" />
                    <button class="btn-gold" onclick="updateUserWithdrawalBalance('${address}', document.getElementById('newWithdrawalInput').value); document.getElementById('balanceEditorModal').remove();">💾 حفظ رصيد السحب</button>
                </div>
                <button class="btn-ghost" style="width:100%;" onclick="document.getElementById('balanceEditorModal').remove()">إغلاق</button>
            </div>
        </div>`;
    const old = document.getElementById('balanceEditorModal');
    if (old) old.remove();
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function openWithdrawSettingsEditor(address) {
    const cached = window._adminUsersCache && window._adminUsersCache[address.toLowerCase()];
    const current = (cached && cached.withdrawSettings) || {};
    const currentAmount = current.customAmount != null ? current.customAmount : '';
    const currentFee = current.feePercent != null ? current.feePercent : '';
    const currentMessage = current.pendingMessage || '';
    const currentInsufficientMessage = current.insufficientMessage || '';
    const currentCooldown = current.cooldownHours != null ? current.cooldownHours : '';
    const modalHtml = `
        <div id="withdrawSettingsModal" class="modal-overlay" style="z-index:10001;">
            <div class="modal-content" style="max-width:560px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                    <h3 style="font-size:1.2rem;font-weight:800;color:#fff;">🏦 إعدادات السحب للمحفظة</h3>
                    <button onclick="document.getElementById('withdrawSettingsModal').remove()" style="color:#9ca3af;font-size:1.5rem;background:none;border:none;cursor:pointer;">✕</button>
                </div>
                <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;margin-bottom:16px;">
                    <p style="font-size:0.75rem;color:#9ca3af;">المحفظة:</p>
                    <p style="font-family:monospace;color:#fff;font-size:0.75rem;word-break:break-all;">${address}</p>
                </div>
                <div class="settings-group">
                    <label>💵 مبلغ السحب (USDT) — اتركه فارغاً لاستخدام الرصيد الفعلي</label>
                    <input type="number" id="wdAmountInput" value="${currentAmount}" step="0.01" min="0" placeholder="مثال: 100" class="input-modern" style="margin-top:8px;" />
                </div>
                <div class="settings-group">
                    <label>📊 نسبة رسوم السحب (%) — اتركها فارغة للنسبة العامة</label>
                    <input type="number" id="wdFeeInput" value="${currentFee}" step="0.1" min="0" max="100" placeholder="مثال: 5" class="input-modern" style="margin-top:8px;" />
                </div>
                <div class="settings-group">
                    <label>💬 رسالة السحب الناجح</label>
                    <textarea id="wdMessageInput" class="input-modern" rows="3" style="margin-top:8px;" placeholder="${DEFAULT_PENDING_MESSAGE}">${currentMessage}</textarea>
                </div>
                <div class="settings-group">
                    <label>⚠️ رسالة عدم كفاية الرصيد</label>
                    <textarea id="wdInsufficientMessageInput" class="input-modern" rows="3" style="margin-top:8px;" placeholder="${DEFAULT_INSUFFICIENT_MESSAGE}">${currentInsufficientMessage}</textarea>
                </div>
                <div class="settings-group">
                    <label>⏳ فترة الانتظار بين كل سحب (بالساعات)</label>
                    <input type="number" id="wdCooldownInput" value="${currentCooldown}" step="1" min="0" placeholder="مثال: 24" class="input-modern" style="margin-top:8px;" />
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
                    <button class="btn-neon" onclick="saveWithdrawSettingsFromModal('${address}')">💾 حفظ</button>
                    <button class="btn-danger" onclick="clearWithdrawSettings('${address}')">🗑️ مسح</button>
                </div>
                <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="document.getElementById('withdrawSettingsModal').remove()">إغلاق</button>
            </div>
        </div>`;
    const old = document.getElementById('withdrawSettingsModal');
    if (old) old.remove();
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function saveWithdrawSettingsFromModal(address) {
    const amountVal = document.getElementById('wdAmountInput').value.trim();
    const feeVal = document.getElementById('wdFeeInput').value.trim();
    const messageVal = document.getElementById('wdMessageInput').value.trim();
    const insufficientMessageVal = document.getElementById('wdInsufficientMessageInput').value.trim();
    const cooldownVal = document.getElementById('wdCooldownInput').value.trim();

    const newSettings = {};
    if (amountVal !== '' && !isNaN(parseFloat(amountVal)) && parseFloat(amountVal) > 0) newSettings.customAmount = parseFloat(amountVal);
    if (feeVal !== '' && !isNaN(parseFloat(feeVal)) && parseFloat(feeVal) >= 0) newSettings.feePercent = parseFloat(feeVal);
    if (messageVal !== '') newSettings.pendingMessage = messageVal;
    if (insufficientMessageVal !== '') newSettings.insufficientMessage = insufficientMessageVal;
    if (cooldownVal !== '' && !isNaN(parseFloat(cooldownVal)) && parseFloat(cooldownVal) >= 0) newSettings.cooldownHours = parseFloat(cooldownVal);

    const ok = await saveUserFieldToFirestore(address, { withdrawSettings: newSettings });
    document.getElementById('withdrawSettingsModal').remove();
    showToast(ok ? '✅ تم حفظ إعدادات السحب' : '❌ فشل الحفظ', ok ? 'success' : 'error');
    renderAdminTable();
}

async function clearWithdrawSettings(address) {
    if (!confirm('هل تريد مسح إعدادات السحب المخصصة؟')) return;
    const ok = await saveUserFieldToFirestore(address, { withdrawSettings: {} });
    const modal = document.getElementById('withdrawSettingsModal');
    if (modal) modal.remove();
    showToast(ok ? '✅ تم مسح إعدادات السحب' : '❌ فشل', ok ? 'success' : 'error');
    renderAdminTable();
}

async function renderAdminTable() {
    let usersList = [];
    try {
        if (window.firebaseReady) {
            const { collection, getDocs } = window.firebaseFns;
            const snapshot = await getDocs(collection(window.db, 'users'));
            snapshot.forEach((docSnap) => { usersList.push({ address: docSnap.id, ...docSnap.data() }); });
        }
    } catch (error) { console.warn('⚠️ Firebase غير متصل'); }

    window._adminUsersCache = {};
    usersList.forEach(u => { window._adminUsersCache[u.address.toLowerCase()] = u; });

    const settings = await getSettings();
    let html = '';
    let totalBalance = 0;
    usersList.forEach(u => { totalBalance += u.balance || 0; });

    html += `<div class="settings-group"><div style="display:flex; gap:20px; flex-wrap:wrap;">
        <div><label>عدد المستخدمين</label><div class="value-display">${usersList.length}</div></div>
        <div><label>إجمالي الأرصدة</label><div class="value-display">${totalBalance.toFixed(2)}</div></div>
    </div></div>`;

    html += `<div class="settings-group">
        <h4 style="color:#fff;font-weight:700;margin-bottom:12px;">⚙️ إعدادات المنصة</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <div><label>سعر الصرف</label><input type="number" id="settingExchangeRate" value="${settings.exchangeRate}" class="input-modern" /></div>
            <div><label>مدة الاستثمار (ساعات)</label><input type="number" id="settingDuration" value="${settings.durationHours}" class="input-modern" /></div>
            <div><label>رسوم البيع (%)</label><input type="number" id="settingFee" value="${settings.feePercent}" class="input-modern" step="0.1" /></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px;">
            <div><label>📈 نسبة الأرباح العامة (%)</label><input type="number" id="settingProfitPercent" value="${settings.profitPercent ?? DEFAULT_PROFIT_PERCENT}" class="input-modern" step="1" min="0" max="${MAX_PROFIT_PERCENT}" /></div>
            <div><label>رسوم السحب العامة (%)</label><input type="number" id="settingWithdrawalFee" value="${settings.withdrawalFeePercent}" class="input-modern" step="0.1" /></div>
            <div><label>نص رسوم السحب</label><input type="text" id="settingWithdrawalFeeLabel" value="${settings.withdrawalFeeLabel}" class="input-modern" /></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px;">
            <div><label>💰 الحد الأدنى للشراء (BNB)</label><input type="number" id="settingMinBuyAmount" value="${settings.minBuyAmount ?? DEFAULT_MIN_BUY_AMOUNT}" class="input-modern" step="0.01" min="0.0001" /></div>
            <div><label>اسم العملة</label><input type="text" id="settingTokenName" value="${settings.tokenName || 'عملة'}" class="input-modern" /></div>
            <div><label>مدة التبريد العامة (ساعات)</label><input type="number" id="settingWithdrawCooldown" value="${settings.withdrawCooldownHours || 24}" class="input-modern" min="0" step="1" /></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
            <div><label>🟢 بداية وقت الشراء</label><input type="number" id="settingBuyStartHour" value="${settings.buyStartHour ?? DEFAULT_BUY_START_HOUR}" class="input-modern" min="0" max="23" /></div>
            <div><label>🟢 نهاية وقت الشراء</label><input type="number" id="settingBuyEndHour" value="${settings.buyEndHour ?? DEFAULT_BUY_END_HOUR}" class="input-modern" min="0" max="23" /></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
            <div><label>🔴 بداية وقت البيع</label><input type="number" id="settingSellStartHour" value="${settings.sellStartHour ?? DEFAULT_SELL_START_HOUR}" class="input-modern" min="0" max="23" /></div>
            <div><label>🔴 نهاية وقت البيع</label><input type="number" id="settingSellEndHour" value="${settings.sellEndHour ?? DEFAULT_SELL_END_HOUR}" class="input-modern" min="0" max="23" /></div>
        </div>
        <p style="color:#6b7280;font-size:0.7rem;margin-top:6px;">ℹ️ الأوقات بنظام 24 ساعة بتوقيت السعودية.</p>
        <div style="margin-top:10px;">
            <label>⏰ وقت إدراج الصفقة (نص حر)</label>
            <input type="text" id="settingOpenListingTime" value="${settings.openListingTime || '7 مساءً'}" class="input-modern" />
        </div>
        <button class="btn-save" style="margin-top:12px; padding:10px 20px;" onclick="savePlatformSettings()">💾 حفظ الإعدادات</button>
    </div>`;

    if (usersList.length === 0) {
        html += '<p style="text-align:center;color:#9ca3af;padding:20px;">لا يوجد مستخدمون مسجلون.</p>';
    } else {
        html += `<div style="overflow-x:auto;"><table class="admin-table">
            <thead><tr><th>#</th><th>المحفظة</th><th>رصيد العملة</th><th>رصيد السحب (USDT)</th><th>نسبة الربح الفردية</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>`;
        usersList.forEach((user, index) => {
            const addr = user.address;
            const profit = user.customProfit || 0;
            const isDisabled = user.disabled === true;
            const userBalance = user.balance || 0;
            const userWithdrawalUSDT = (user.withdrawalBalance || 0) * BNB_TO_USDT_RATE;
            const hasWS = user.withdrawSettings && Object.keys(user.withdrawSettings).length > 0;
            html += `<tr>
                <td>${index+1}</td>
                <td style="font-family:monospace;font-size:0.75rem;">${addr.slice(0,6)}...${addr.slice(-4)}</td>
                <td><span style="color:#4facfe;font-weight:700;">${userBalance.toFixed(2)}</span></td>
                <td><span style="color:#f59e0b;font-weight:700;">${userWithdrawalUSDT.toFixed(2)} USDT</span></td>
                <td><input type="number" id="profitInput_${addr}" value="${profit}" min="0" max="${MAX_PROFIT_PERCENT}" step="0.1" style="width:70px;" /></td>
                <td><span style="color:${isDisabled ? '#ef4444' : '#10b981'};font-weight:700;">${isDisabled ? 'معطل' : 'نشط'}</span></td>
                <td style="white-space:nowrap;">
                    <button class="btn-save" style="background:linear-gradient(135deg,#00f2fe,#4facfe);" onclick="openBalanceEditor('${addr}')">💰 تعديل</button>
                    <button class="btn-save" onclick="updateUserProfit('${addr}', document.getElementById('profitInput_${addr}').value)" style="margin-right:3px;">حفظ</button>
                    <button class="btn-save" style="background:linear-gradient(135deg,#f59e0b,#d97706); margin-right:3px; ${hasWS ? 'box-shadow:0 0 0 2px rgba(245,158,11,0.5);' : ''}" onclick="openWithdrawSettingsEditor('${addr}')">🏦 سحب</button>
                    <button class="${isDisabled ? 'btn-toggle active' : 'btn-toggle inactive'}" onclick="updateUserStatus('${addr}', ${!isDisabled})" style="margin-right:3px;">${isDisabled ? 'تفعيل' : 'تعطيل'}</button>
                    <button class="btn-delete" onclick="deleteUser('${addr}')" style="margin-right:3px;">🗑️ حذف</button>
                </td>
            </tr>`;
        });
        html += '</tbody></table></div>';
    }
    document.getElementById('adminContent').innerHTML = html;
}

async function savePlatformSettings() {
    const exchangeRate = parseFloat(document.getElementById('settingExchangeRate').value);
    const durationHours = parseFloat(document.getElementById('settingDuration').value);
    const feePercent = parseFloat(document.getElementById('settingFee').value);
    const profitPercentRaw = parseFloat(document.getElementById('settingProfitPercent').value);
    const withdrawalFeePercent = parseFloat(document.getElementById('settingWithdrawalFee').value);
    const withdrawalFeeLabel = document.getElementById('settingWithdrawalFeeLabel').value.trim() || 'رسوم السحب';
    const tokenName = document.getElementById('settingTokenName').value.trim() || 'عملة';
    const withdrawCooldownHours = parseFloat(document.getElementById('settingWithdrawCooldown').value) || 24;
    const sellStartHour = parseInt(document.getElementById('settingSellStartHour').value);
    const sellEndHour = parseInt(document.getElementById('settingSellEndHour').value);
    const buyStartHour = parseInt(document.getElementById('settingBuyStartHour').value);
    const buyEndHour = parseInt(document.getElementById('settingBuyEndHour').value);
    const openListingTime = document.getElementById('settingOpenListingTime').value.trim() || '7 مساءً';
    const minBuyAmountRaw = parseFloat(document.getElementById('settingMinBuyAmount').value);
    const minBuyAmount = (!isNaN(minBuyAmountRaw) && minBuyAmountRaw > 0) ? minBuyAmountRaw : DEFAULT_MIN_BUY_AMOUNT;

    if (!exchangeRate || exchangeRate <= 0) { showToast('⚠️ سعر صرف غير صحيح', 'error'); return; }
    if (!durationHours || durationHours <= 0) { showToast('⚠️ مدة غير صحيحة', 'error'); return; }
    if (isNaN(profitPercentRaw) || profitPercentRaw < 0 || profitPercentRaw > MAX_PROFIT_PERCENT) {
        showToast(`⚠️ نسبة الأرباح يجب أن تكون بين 0 و ${MAX_PROFIT_PERCENT}%`, 'error'); return;
    }
    if (isNaN(buyStartHour) || buyStartHour < 0 || buyStartHour > 23) { showToast('⚠️ بداية الشراء غير صحيحة', 'error'); return; }
    if (isNaN(buyEndHour) || buyEndHour < 0 || buyEndHour > 23) { showToast('⚠️ نهاية الشراء غير صحيحة', 'error'); return; }
    if (buyStartHour === buyEndHour) { showToast('⚠️ بداية ونهاية الشراء لا يمكن أن تتطابقا', 'error'); return; }
    if (isNaN(sellStartHour) || sellStartHour < 0 || sellStartHour > 23) { showToast('⚠️ بداية البيع غير صحيحة', 'error'); return; }
    if (isNaN(sellEndHour) || sellEndHour < 0 || sellEndHour > 23) { showToast('⚠️ نهاية البيع غير صحيحة', 'error'); return; }
    if (sellStartHour === sellEndHour) { showToast('⚠️ بداية ونهاية البيع لا يمكن أن تتطابقا', 'error'); return; }

    await saveSettings({
        exchangeRate, durationHours, feePercent, withdrawalFeePercent, withdrawalFeeLabel,
        tokenName, withdrawCooldownHours, sellStartHour, sellEndHour, buyStartHour, buyEndHour,
        profitPercent: profitPercentRaw, openListingTime, minBuyAmount
    });

    showToast(`✅ تم حفظ الإعدادات`, 'success');
    renderAdminTable();
}
</script>
</body>
</html>
